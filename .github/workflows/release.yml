# Push a tag like v0.1.2 (matching package.json "version") to build and publish
# inception-mcp.mcpb as a GitHub Release asset.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version v$v"; exit 1; }
      - run: npm test
      - run: npm run pack:mcpb
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" inception-mcp.mcpb \
            --title "$GITHUB_REF_NAME" \
            --notes "Double-click inception-mcp.mcpb to install in Claude Desktop. Requires Inception firmware 7.3.0.8528 or later."
